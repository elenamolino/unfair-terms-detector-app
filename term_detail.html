<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <link rel="icon" href="/unfair-terms-detector-app/favicon.ico" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Web site created using create-react-app" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="apple-touch-icon" href="/unfair-terms-detector-app/logo192.png" />
    <link rel="manifest" href="/unfair-terms-detector-app/manifest.json" />
    <title>React App</title>
    <script defer="defer" src="/unfair-terms-detector-app/static/js/main.44c82b23.js"></script>
    <link rel="stylesheet" href="static/css/style.css">
    <link href="/unfair-terms-detector-app/static/css/main.fccc8c9b.css" rel="stylesheet">
    <link rel="stylesheet" href="static/css/bootstrap.min.css">
    <script src="static/js/libs/bootstrap.min.js"></script>
    <script src="static/js/libs/sbd.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="static/js/details.js" type="module"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body><noscript>You need to enable JavaScript to run this app.</noscript>
    <div class="container my-5">
        <div class="row mb-4">
            <div class="col">
                <header id="header-block">
                    <div class="row text-center">
                        <div class="col-12 col-lg-10 offset-lg-1">
                            <div class="title-block">
                                <h1 id="title" class="mb-4">Unfair Terms Detector <i class="fa fa-star"
                                        aria-hidden="true"></i>
                                </h1>
                                <h3 id="subtitle">University of Seville</h3>
                                <nav class="navbar navbar-expand-lg navbar-light">
                                    <div class="container-fluid">
                                        <div class="collapse navbar-collapse" id="navbarNav">
                                            <ul class="navbar-nav">
                                                <li class="nav-item">
                                                    <a class="nav-link" href="index.html">Analyser</a>
                                                </li>
                                                <li class="nav-item">
                                                    <a class="nav-link" href="playground.html">Playground</a>
                                                </li>
                                            </ul>
                                        </div>
                                    </div>
                                </nav>
                            </div>
                        </div>
                    </div>
                </header>

                <div class="row mt-4">
                    <div class="col-12 col-lg-10 offset-lg-1">
                        <div class="flex-grow-1 text-center">
                            <div id="detail-tos">
                            </div>
                        </div>
                    </div>
                </div>

                <div id="filter-terms" class="row mt-4 visually-hidden">
                    <div class="col-12 col-lg-5 offset-lg-1">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio1"
                                value="all" checked>
                            <label class="form-check-label" for="inlineRadio1">VIEW ALL</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="inlineRadioOptions" id="inlineRadio2"
                                value="unfair">
                            <label class="form-check-label" for="inlineRadio2">UNFAIR TERMS</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" id="inlineCheckbox3" value="likely">
                            <label class="form-check-label" for="inlineCheckbox3">HIGHEST TO LOWEST</label>
                        </div>
                    </div>
                    <div class="col-12 col-lg-5">
                        <div class="row">
                            <div class="col-8">
                                <input type="range" class="form-range flex-grow-1" min="0" max="100" step="10"
                                    id="customRange2" value="0"
                                    oninput="document.getElementById('rangeValue').value = parseInt(this.value);">
                            </div>
                            <div class="col-4">
                                <span class="ms-2">Threshold:</span>
                                <output id="rangeValue" class="ms-2">0</output>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="col-12 col-lg-10 offset-lg-1">
                        <div id="results">
                        </div>
                    </div>
                </div>

                <footer id="footer-block">
                    Made with love &hearts; &copy; 2024
                </footer>
            </div>
        </div>
    </div>
</body>

</html>
